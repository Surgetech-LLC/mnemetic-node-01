services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mnemetic-node-exporter
    restart: unless-stopped

    ports:
      - "127.0.0.1:9100:9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
